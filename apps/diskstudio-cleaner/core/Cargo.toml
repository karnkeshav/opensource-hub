[package]
name = "diskstudio-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
rayon = "1.10"
glob = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_SystemServices",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3.17"
proptest = "1.6"
filetime = "0.2"
