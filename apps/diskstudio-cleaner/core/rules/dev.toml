[[rule]]
id = "dev-cache-npm"
category = "developer-caches"
title = "npm package cache"
description = "Cached tarballs of downloaded node packages."
risk = "safe"
action = "delete"
paths = [
    "%LOCALAPPDATA%\\npm-cache\\*",
    "%APPDATA%\\npm-cache\\*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = []

