[[rule]]
id = "macos-app-slack"
category = "app-caches"
title = "Slack Cache"
description = "Cached workspace messages and profile images."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Caches/com.tinyspeck.slackmacgap/*",
    "~/Library/Application Support/Slack/Cache/*",
    "~/Library/Application Support/Slack/Code Cache/*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = ["Slack"]

[[rule]]
id = "macos-app-teams"
category = "app-caches"
title = "Microsoft Teams Cache"
description = "Cached media previews and diagnostic logs."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Caches/com.microsoft.teams2/*",
    "~/Library/Group Containers/UBF8T346G9.com.microsoft.teams/Library/Caches/*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = ["Microsoft Teams"]

