[[rule]]
id = "macos-browser-safari"
category = "browser-caches"
title = "Safari WebKit Cache"
description = "Cached website images and scripts. Never touches passwords, history, or bookmarks."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Caches/com.apple.Safari/*",
    "~/Library/Containers/com.apple.Safari/Data/Library/Caches/*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = ["Safari"]

[[rule]]
id = "macos-browser-chrome"
category = "browser-caches"
title = "Google Chrome Cache"
description = "Cached web pages and compiled code cache."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Caches/Google/Chrome/*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = ["Google Chrome"]

[[rule]]
id = "macos-browser-firefox"
