[[rule]]
id = "macos-dev-xcode-deriveddata"
category = "developer-caches"
title = "Xcode DerivedData Build Cache"
description = "Intermediate build artifacts, module indexes and logs created by Xcode."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Developer/Xcode/DerivedData/*"
]
exclude = []
min_age_days = 0
requires_admin = false
requires_closed = ["Xcode"]

[[rule]]
id = "macos-dev-xcode-devicesupport"
category = "developer-caches"
title = "Xcode iOS & watchOS Device Support Symbols"
description = "Cached debug symbols from connected iOS and watchOS devices."
risk = "safe"
action = "delete"
paths = [
    "~/Library/Developer/Xcode/iOS DeviceSupport/*",
    "~/Library/Developer/Xcode/watchOS DeviceSupport/*"
]
exclude = []
min_age_days = 30
requires_admin = false
requires_closed = ["Xcode"]

