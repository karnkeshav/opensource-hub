[[rule]]
id = "temp-user"
category = "temp-files"
title = "User temporary files"
description = "Temporary files created by apps and Windows in your user profile."
risk = "safe"
action = "delete"
paths = [
    "%LOCALAPPDATA%\\Temp\\*",
    "%TEMP%\\*"
]
exclude = []
min_age_days = 1
requires_admin = false
requires_closed = []

[[rule]]
id = "temp-windows"
category = "temp-files"
title = "Windows temporary files"
description = "System temporary files generated by background services and installers."
risk = "safe"
action = "delete"
paths = [
    "%WINDIR%\\Temp\\*"
]
exclude = []
min_age_days = 1
requires_admin = true
requires_closed = []
