[package]
name = "diskstudio-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DiskStudio-Cleaner"
path = "src/main.rs"

[dependencies]
diskstudio-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
